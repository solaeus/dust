[package]
name = "dust-vm"
description = "Dust virtual machine"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]

[features]
mimalloc = ["dust-compiler/mimalloc"]

[dependencies]
bumpalo = { version = "3.20.3", features = ["boxed", "collections"] }
crossbeam = { version = "0.8.4", features = ["crossbeam-channel", "nightly"] }
dust-compiler = { path = "../dust-compiler" }
rustc-hash = "2.1.3"
tracing = "0.1.44"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
